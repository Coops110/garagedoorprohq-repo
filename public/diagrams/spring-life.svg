<svg viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="dl-spring-life-title" aria-describedby="dl-spring-life-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-spring-life-title">
    How long garage door springs last at different daily usage rates
  </title><desc id="dl-spring-life-desc">A bar chart comparing a standard 10,000-cycle spring against a high-cycle 25,000-cycle spring. At two openings a day the standard spring lasts about 13.7 years and the high-cycle about 34.2 years. At eight openings a day the standard spring lasts about 3.4 years and the high-cycle about 8.6 years.</desc><rect x="0" y="0" width="560" height="300" fill="#F8F7F4"></rect><g><line x1="132" y1="52" x2="132" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="132" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">0</text></g><g><line x1="188.57142857142858" y1="52" x2="188.57142857142858" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="188.57142857142858" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">5</text></g><g><line x1="245.14285714285717" y1="52" x2="245.14285714285717" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="245.14285714285717" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">10</text></g><g><line x1="301.7142857142857" y1="52" x2="301.7142857142857" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="301.7142857142857" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">15</text></g><g><line x1="358.28571428571433" y1="52" x2="358.28571428571433" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="358.28571428571433" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">20</text></g><g><line x1="414.8571428571429" y1="52" x2="414.8571428571429" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="414.8571428571429" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">25</text></g><g><line x1="471.42857142857144" y1="52" x2="471.42857142857144" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="471.42857142857144" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">30</text></g><g><line x1="528" y1="52" x2="528" y2="252" stroke="#E4E2DC" stroke-width="1.5"></line><text x="528" y="274" font-family="Inter, sans-serif" font-size="19" fill="#646E7A" text-anchor="middle">35</text></g><text x="330" y="296" font-family="Inter, sans-serif" font-size="19" fill="#4B5563" text-anchor="middle" font-weight="600">years of service</text><g><text x="118" y="79" font-family="Inter, sans-serif" font-size="20" fill="#1B222B" text-anchor="end" font-weight="600">2/day</text><rect x="132" y="80" width="387.4755381604697" height="14" rx="3" fill="#2C5F7C"></rect><rect x="132" y="62" width="154.99021526418787" height="14" rx="3" fill="#D9480F"></rect></g><g><text x="118" y="117" font-family="Inter, sans-serif" font-size="20" fill="#1B222B" text-anchor="end" font-weight="600">4/day</text><rect x="132" y="118" width="193.73776908023484" height="14" rx="3" fill="#2C5F7C"></rect><rect x="132" y="100" width="77.49510763209393" height="14" rx="3" fill="#D9480F"></rect></g><g><text x="118" y="155" font-family="Inter, sans-serif" font-size="20" fill="#1B222B" text-anchor="end" font-weight="600">6/day</text><rect x="132" y="156" width="129.15851272015655" height="14" rx="3" fill="#2C5F7C"></rect><rect x="132" y="138" width="51.663405088062625" height="14" rx="3" fill="#D9480F"></rect></g><g><text x="118" y="193" font-family="Inter, sans-serif" font-size="20" fill="#1B222B" text-anchor="end" font-weight="600">8/day</text><rect x="132" y="194" width="96.86888454011742" height="14" rx="3" fill="#2C5F7C"></rect><rect x="132" y="176" width="38.74755381604697" height="14" rx="3" fill="#D9480F"></rect></g><g><text x="118" y="231" font-family="Inter, sans-serif" font-size="20" fill="#1B222B" text-anchor="end" font-weight="600">10/day</text><rect x="132" y="232" width="77.49510763209393" height="14" rx="3" fill="#2C5F7C"></rect><rect x="132" y="214" width="30.998043052837573" height="14" rx="3" fill="#D9480F"></rect></g><line x1="132" y1="52" x2="132" y2="252" stroke="#1B222B" stroke-width="2.5"></line><line x1="132" y1="252" x2="528" y2="252" stroke="#1B222B" stroke-width="2.5"></line><line x1="211.2" y1="44" x2="211.2" y2="252" stroke="#C77D02" stroke-width="2" stroke-dasharray="6 4"></line><text x="219.2" y="40" font-family="Inter, sans-serif" font-size="19" fill="#C77D02" font-weight="700">7 yrs</text></svg>
