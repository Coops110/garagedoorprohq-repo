<svg viewBox="0 0 460 220" width="460" height="220" role="img" aria-labelledby="dl-opener-types-jack-title" aria-describedby="dl-opener-types-jack-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-opener-types-jack-title">Wall-mounted jackshaft opener</title><desc id="dl-opener-types-jack-desc">Side view of the same garage. The motor mounts on the wall beside the opening and turns the torsion shaft directly, so there is no ceiling rail and the whole ceiling stays clear for storage.</desc><rect x="0" y="0" width="460" height="220" fill="#F8F7F4"></rect><line x1="20" y1="34" x2="440" y2="34" stroke="#1B222B" stroke-width="3"></line><line x1="20" y1="186" x2="440" y2="186" stroke="#1B222B" stroke-width="3"></line><line x1="20" y1="34" x2="20" y2="186" stroke="#4B5563" stroke-width="2"></line><rect x="410" y="42" width="14" height="144" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><line x1="150" y1="52" x2="410" y2="52" stroke="#4B5563" stroke-width="2.5"></line><circle cx="398" cy="52" r="9" fill="#1B222B"></circle><rect x="356" y="62" width="42" height="52" rx="4" fill="#2C5F7C"></rect><line x1="377" y1="62" x2="394" y2="56" stroke="#D9480F" stroke-width="4"></line><rect x="120" y="40" width="150" height="26" rx="3" fill="none" stroke="#C77D02" stroke-width="2.5" stroke-dasharray="6 4"></rect><text x="195" y="58" font-family="Inter, sans-serif" font-size="17" fill="#C77D02" text-anchor="middle" font-weight="700">ceiling free</text><g font-family="Inter, sans-serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central"><circle cx="377" cy="140" r="15" fill="#2C5F7C"></circle><text x="377" y="140" fill="#fff">4</text><line x1="377" y1="116" x2="377" y2="126" stroke="#4B5563" stroke-width="1.5"></line><circle cx="195" cy="100" r="15" fill="#C77D02"></circle><text x="195" y="100" fill="#fff">5</text><line x1="195" y1="70" x2="195" y2="86" stroke="#4B5563" stroke-width="1.5"></line></g></svg>
