<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 260" width="560" height="260" role="img" aria-labelledby="dl-trolley-cord-title" aria-describedby="dl-trolley-cord-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-trolley-cord-title">
    Opener trolley, emergency release cord and door travel limits
  </title><desc id="dl-trolley-cord-desc">Side view of a garage door opener. A trolley travels along the rail below the motor and connects to the door by an arm. A red cord hangs from the trolley to disconnect the door so it can be moved by hand. Two marks show the stored open and closed limit positions that tell the opener where to stop.</desc><rect x="0" y="0" width="560" height="260" fill="#F8F7F4"></rect><line x1="24" y1="34" x2="536" y2="34" stroke="#1B222B" stroke-width="3"></line><line x1="24" y1="230" x2="536" y2="230" stroke="#1B222B" stroke-width="3"></line><line x1="66" y1="34" x2="66" y2="52" stroke="#4B5563" stroke-width="2"></line><line x1="106" y1="34" x2="106" y2="52" stroke="#4B5563" stroke-width="2"></line><rect x="52" y="52" width="68" height="40" rx="5" fill="#2C5F7C"></rect><rect x="120" y="66" width="376" height="9" rx="4" fill="#4B5563"></rect><rect x="300" y="58" width="34" height="24" rx="4" fill="#D9480F"></rect><line x1="330" y1="82" x2="452" y2="112" stroke="#1B222B" stroke-width="4"></line><rect x="452" y="106" width="18" height="124" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><line x1="317" y1="82" x2="317" y2="150" stroke="#C81E1E" stroke-width="3.5"></line><ellipse cx="317" cy="160" rx="9" ry="13" fill="#C81E1E"></ellipse><g stroke="#C77D02" stroke-width="3" stroke-dasharray="7 5"><line x1="140" y1="96" x2="140" y2="128"></line><line x1="488" y1="96" x2="488" y2="128"></line></g><text x="140" y="150" font-family="Inter, sans-serif" font-size="19" fill="#C77D02" text-anchor="middle" font-weight="700">open</text><text x="488" y="150" font-family="Inter, sans-serif" font-size="19" fill="#C77D02" text-anchor="middle" font-weight="700">closed</text><g font-family="Inter, sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central"><g><line x1="317" y1="70" x2="260" y2="34" stroke="#4B5563" stroke-width="1.5"></line><circle cx="242" cy="26" r="19" fill="#D9480F"></circle><text x="242" y="26" fill="#fff">1</text></g><g><line x1="317" y1="173" x2="317" y2="196" stroke="#4B5563" stroke-width="1.5"></line><circle cx="317" cy="212" r="19" fill="#C81E1E"></circle><text x="317" y="212" fill="#fff">2</text></g><g><line x1="140" y1="128" x2="86" y2="176" stroke="#4B5563" stroke-width="1.5"></line><circle cx="68" cy="190" r="19" fill="#C77D02"></circle><text x="68" y="190" fill="#fff">3</text></g><g><line x1="461" y1="180" x2="520" y2="196" stroke="#4B5563" stroke-width="1.5"></line><circle cx="538" cy="200" r="19" fill="#1B222B"></circle><text x="538" y="200" fill="#fff">4</text></g></g></svg>
