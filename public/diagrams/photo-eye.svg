<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="dl-photo-eye-title" aria-describedby="dl-photo-eye-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-photo-eye-title">How garage door photo-eye sensors work</title><desc id="dl-photo-eye-desc">Two sensors face each other about six inches above the floor on either side of the opening. One sends an infrared beam to the other. An object breaking the beam while the door is closing makes the door reverse and travel back up.</desc><rect x="0" y="0" width="560" height="300" fill="#F8F7F4"></rect><!-- opening jambs --><rect x="40" y="20" width="18" height="230" fill="#EFEDE6" stroke="#E4E2DC" stroke-width="2"></rect><rect x="502" y="20" width="18" height="230" fill="#EFEDE6" stroke="#E4E2DC" stroke-width="2"></rect><!-- part-closed door coming down --><rect x="58" y="26" width="444" height="40" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><rect x="58" y="70" width="444" height="40" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><!-- travel arrow: door reversing back up --><g stroke="#D9480F" stroke-width="4" fill="none"><line x1="280" y1="150" x2="280" y2="126"></line><polyline points="268,136 280,122 292,136" stroke-linejoin="round"></polyline></g><text x="300" y="146" font-family="Inter, sans-serif" font-size="16" fill="#D9480F" font-weight="700">door reverses</text><!-- floor --><line x1="20" y1="250" x2="540" y2="250" stroke="#1B222B" stroke-width="3"></line><!-- sensors, about six inches up --><g><rect x="52" y="212" width="20" height="26" rx="4" fill="#2C5F7C"></rect><circle cx="72" cy="225" r="5" fill="#C77D02"></circle><rect x="488" y="212" width="20" height="26" rx="4" fill="#2C5F7C"></rect><circle cx="488" cy="225" r="5" fill="#C77D02"></circle></g><!-- the beam, broken in the middle --><line x1="78" y1="225" x2="248" y2="225" stroke="#C77D02" stroke-width="3" stroke-dasharray="9 6"></line><line x1="312" y1="225" x2="482" y2="225" stroke="#C77D02" stroke-width="3" stroke-dasharray="9 6"></line><!-- the obstruction breaking it --><rect x="256" y="196" width="48" height="54" rx="4" fill="#D9480F" opacity="0.18" stroke="#D9480F" stroke-width="2.5"></rect><line x1="256" y1="196" x2="304" y2="250" stroke="#D9480F" stroke-width="2"></line><line x1="304" y1="196" x2="256" y2="250" stroke="#D9480F" stroke-width="2"></line><!-- six-inch dimension --><line x1="530" y1="225" x2="530" y2="250" stroke="#646E7A" stroke-width="1.5"></line><line x1="524" y1="225" x2="536" y2="225" stroke="#646E7A" stroke-width="1.5"></line><line x1="524" y1="250" x2="536" y2="250" stroke="#646E7A" stroke-width="1.5"></line><g font-family="Inter, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central"><g><line x1="62" y1="212" x2="62" y2="188" stroke="#4B5563" stroke-width="1.5"></line><circle cx="62" cy="174" r="19" fill="#2C5F7C"></circle><text x="62" y="174" fill="#fff">1</text></g><g><line x1="160" y1="225" x2="160" y2="258" stroke="#4B5563" stroke-width="1.5"></line><circle cx="160" cy="279" r="19" fill="#C77D02"></circle><text x="160" y="279" fill="#fff">2</text></g><g><line x1="280" y1="250" x2="280" y2="258" stroke="#4B5563" stroke-width="1.5"></line><circle cx="280" cy="279" r="19" fill="#D9480F"></circle><text x="280" y="279" fill="#fff">3</text></g><g><circle cx="530" cy="279" r="19" fill="#646E7A"></circle><text x="530" y="279" fill="#fff">4</text><line x1="530" y1="256" x2="530" y2="262" stroke="#4B5563" stroke-width="1.5"></line></g></g></svg>
