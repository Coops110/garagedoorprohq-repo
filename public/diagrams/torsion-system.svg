<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="dl-torsion-system-title" aria-describedby="dl-torsion-system-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-torsion-system-title">Anatomy of a torsion-spring garage door</title><desc id="dl-torsion-system-desc">Front view of a garage door opening. A horizontal steel shaft runs above the door carrying two coiled torsion springs, with a cable drum at each end. A lift cable runs from each drum down to the bottom bracket of the door. The door itself is four hinged sections running in a vertical track on each side.</desc><!-- wall / opening --><rect x="0" y="0" width="640" height="400" fill="#F8F7F4"></rect><rect x="40" y="86" width="560" height="284" fill="#FFFFFF" stroke="#E4E2DC" stroke-width="2"></rect><!-- Header wall above the opening. Deliberately unlabeled: a text label here
       rendered at about 7px on a phone AND collided with callouts 1 and 3.
       Anything worth naming goes in the HTML legend, which is the entire point
       of the callout system — see the note in Figure.astro. --><rect x="40" y="30" width="560" height="56" fill="#EFEDE6" stroke="#E4E2DC" stroke-width="2"></rect><!-- torsion shaft --><line x1="60" y1="104" x2="580" y2="104" stroke="#1B222B" stroke-width="7" stroke-linecap="round"></line><!-- center bearing plate --><rect x="306" y="92" width="28" height="24" rx="3" fill="#1B222B"></rect><!-- left spring: coils drawn as a run of ellipses along the shaft --><g fill="none" stroke="#D9480F" stroke-width="4"><ellipse cx="122" cy="104" rx="6" ry="17"></ellipse><ellipse cx="135" cy="104" rx="6" ry="17"></ellipse><ellipse cx="148" cy="104" rx="6" ry="17"></ellipse><ellipse cx="161" cy="104" rx="6" ry="17"></ellipse><ellipse cx="174" cy="104" rx="6" ry="17"></ellipse><ellipse cx="187" cy="104" rx="6" ry="17"></ellipse><ellipse cx="200" cy="104" rx="6" ry="17"></ellipse><ellipse cx="213" cy="104" rx="6" ry="17"></ellipse><ellipse cx="226" cy="104" rx="6" ry="17"></ellipse><ellipse cx="239" cy="104" rx="6" ry="17"></ellipse><ellipse cx="252" cy="104" rx="6" ry="17"></ellipse><ellipse cx="265" cy="104" rx="6" ry="17"></ellipse><ellipse cx="278" cy="104" rx="6" ry="17"></ellipse></g><!-- right spring --><g fill="none" stroke="#D9480F" stroke-width="4"><ellipse cx="362" cy="104" rx="6" ry="17"></ellipse><ellipse cx="375" cy="104" rx="6" ry="17"></ellipse><ellipse cx="388" cy="104" rx="6" ry="17"></ellipse><ellipse cx="401" cy="104" rx="6" ry="17"></ellipse><ellipse cx="414" cy="104" rx="6" ry="17"></ellipse><ellipse cx="427" cy="104" rx="6" ry="17"></ellipse><ellipse cx="440" cy="104" rx="6" ry="17"></ellipse><ellipse cx="453" cy="104" rx="6" ry="17"></ellipse><ellipse cx="466" cy="104" rx="6" ry="17"></ellipse><ellipse cx="479" cy="104" rx="6" ry="17"></ellipse><ellipse cx="492" cy="104" rx="6" ry="17"></ellipse><ellipse cx="505" cy="104" rx="6" ry="17"></ellipse><ellipse cx="518" cy="104" rx="6" ry="17"></ellipse></g><!-- winding cones at the inner ends --><rect x="288" y="95" width="14" height="18" rx="2" fill="#4B5563"></rect><rect x="338" y="95" width="14" height="18" rx="2" fill="#4B5563"></rect><!-- cable drums at the outer ends --><circle cx="78" cy="104" r="19" fill="#2C5F7C"></circle><circle cx="78" cy="104" r="8" fill="#FFFFFF"></circle><circle cx="562" cy="104" r="19" fill="#2C5F7C"></circle><circle cx="562" cy="104" r="8" fill="#FFFFFF"></circle><!-- lift cables running down to the bottom bracket --><line x1="78" y1="123" x2="78" y2="352" stroke="#2C5F7C" stroke-width="3" stroke-dasharray="1 0"></line><line x1="562" y1="123" x2="562" y2="352" stroke="#2C5F7C" stroke-width="3"></line><!-- vertical tracks --><rect x="60" y="128" width="12" height="230" fill="none" stroke="#4B5563" stroke-width="2.5"></rect><rect x="568" y="128" width="12" height="230" fill="none" stroke="#4B5563" stroke-width="2.5"></rect><!-- door sections --><rect x="88" y="144" width="464" height="50" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><rect x="88" y="198" width="464" height="50" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><rect x="88" y="252" width="464" height="50" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><rect x="88" y="306" width="464" height="50" rx="3" fill="#F3F1EA" stroke="#4B5563" stroke-width="2"></rect><!-- panel detail --><g><rect x="112" y="156" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect><rect x="340" y="156" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect></g><g><rect x="112" y="210" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect><rect x="340" y="210" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect></g><g><rect x="112" y="264" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect><rect x="340" y="264" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect></g><g><rect x="112" y="318" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect><rect x="340" y="318" width="188" height="26" rx="2" fill="none" stroke="#E4E2DC" stroke-width="2"></rect></g><!-- rollers on the door edges --><g><circle cx="80" cy="169" r="7" fill="#C77D02"></circle><circle cx="560" cy="169" r="7" fill="#C77D02"></circle></g><g><circle cx="80" cy="223" r="7" fill="#C77D02"></circle><circle cx="560" cy="223" r="7" fill="#C77D02"></circle></g><g><circle cx="80" cy="277" r="7" fill="#C77D02"></circle><circle cx="560" cy="277" r="7" fill="#C77D02"></circle></g><g><circle cx="80" cy="331" r="7" fill="#C77D02"></circle><circle cx="560" cy="331" r="7" fill="#C77D02"></circle></g><!-- bottom bracket where the cable anchors --><rect x="68" y="346" width="24" height="16" rx="2" fill="#1B222B"></rect><rect x="548" y="346" width="24" height="16" rx="2" fill="#1B222B"></rect><!-- floor --><line x1="20" y1="370" x2="620" y2="370" stroke="#1B222B" stroke-width="3"></line><!-- Numbered callouts. Marker geometry is sized so it renders at roughly
       21px across whatever the drawing scales to: a 640-wide viewBox lands at
       about 319px on a 375px phone, so r=15 would have rendered a 7px circle
       with an unreadable 8px digit. See the note in Figure.astro. --><g font-family="Inter, sans-serif" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central"><g><line x1="200" y1="104" x2="200" y2="62" stroke="#4B5563" stroke-width="1.5"></line><circle cx="200" cy="48" r="21" fill="#D9480F"></circle><text x="200" y="48" fill="#fff">1</text></g><g><line x1="320" y1="116" x2="320" y2="150" stroke="#4B5563" stroke-width="1.5"></line><circle cx="320" cy="62" r="21" fill="#1B222B"></circle><text x="320" y="62" fill="#fff">2</text><line x1="320" y1="92" x2="320" y2="77" stroke="#4B5563" stroke-width="1.5"></line></g><g><line x1="78" y1="85" x2="78" y2="70" stroke="#4B5563" stroke-width="1.5"></line><circle cx="78" cy="55" r="21" fill="#2C5F7C"></circle><text x="78" y="55" fill="#fff">3</text></g><g><line x1="562" y1="240" x2="592" y2="240" stroke="#4B5563" stroke-width="1.5"></line><circle cx="614" cy="240" r="21" fill="#2C5F7C"></circle><text x="614" y="240" fill="#fff">4</text></g><g><line x1="60" y1="290" x2="48" y2="290" stroke="#4B5563" stroke-width="1.5"></line><circle cx="26" cy="290" r="21" fill="#4B5563"></circle><text x="26" y="290" fill="#fff">5</text></g><g><line x1="567" y1="331" x2="592" y2="331" stroke="#4B5563" stroke-width="1.5"></line><circle cx="614" cy="331" r="21" fill="#C77D02"></circle><text x="614" y="331" fill="#fff">6</text></g><g><line x1="90" y1="354" x2="172" y2="374" stroke="#4B5563" stroke-width="1.5"></line><circle cx="196" cy="377" r="21" fill="#1B222B"></circle><text x="196" y="377" fill="#fff">7</text></g></g></svg>
