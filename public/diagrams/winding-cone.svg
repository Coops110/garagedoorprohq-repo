<svg viewBox="0 0 460 260" width="460" height="260" role="img" aria-labelledby="dl-winding-cone-title" aria-describedby="dl-winding-cone-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-winding-cone-title">Parts of a torsion spring winding cone</title><desc id="dl-winding-cone-desc">The end of a torsion spring where it meets a cast winding cone on the torsion shaft. The cone has holes around it for winding bars, and set screws that clamp it to the shaft. A solid steel winding bar is shown inserted into one hole. This shows the parts only and is not instructions for winding a spring.</desc><rect x="0" y="0" width="460" height="260" fill="#F8F7F4"></rect><line x1="20" y1="130" x2="440" y2="130" stroke="#1B222B" stroke-width="12" stroke-linecap="round"></line><g fill="none" stroke="#D9480F" stroke-width="5"><ellipse cx="54" cy="130" rx="10" ry="34"></ellipse><ellipse cx="78" cy="130" rx="10" ry="34"></ellipse><ellipse cx="102" cy="130" rx="10" ry="34"></ellipse><ellipse cx="126" cy="130" rx="10" ry="34"></ellipse><ellipse cx="150" cy="130" rx="10" ry="34"></ellipse><ellipse cx="174" cy="130" rx="10" ry="34"></ellipse><ellipse cx="198" cy="130" rx="10" ry="34"></ellipse><ellipse cx="222" cy="130" rx="10" ry="34"></ellipse></g><path d="M256 96 L300 106 L300 154 L256 164 Z" fill="#4B5563"></path><rect x="300" y="104" width="40" height="52" rx="4" fill="#1B222B"></rect><circle cx="318" cy="118" r="6" fill="#F8F7F4"></circle><circle cx="318" cy="142" r="6" fill="#F8F7F4"></circle><rect x="308" y="94" width="10" height="12" rx="2" fill="#C77D02"></rect><rect x="324" y="94" width="10" height="12" rx="2" fill="#C77D02"></rect><rect x="312" y="30" width="13" height="90" rx="3" fill="#2C5F7C"></rect><rect x="309" y="26" width="19" height="10" rx="3" fill="#204A61"></rect><g font-family="Inter, sans-serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central"><g><line x1="120" y1="130" x2="120" y2="212" stroke="#4B5563" stroke-width="1.5"></line><circle cx="120" cy="228" r="15" fill="#D9480F"></circle><text x="120" y="228" fill="#fff">1</text></g><g><line x1="278" y1="130" x2="230" y2="212" stroke="#4B5563" stroke-width="1.5"></line><circle cx="222" cy="228" r="15" fill="#4B5563"></circle><text x="222" y="228" fill="#fff">2</text></g><g><line x1="329" y1="100" x2="392" y2="72" stroke="#4B5563" stroke-width="1.5"></line><circle cx="410" cy="66" r="15" fill="#C77D02"></circle><text x="410" y="66" fill="#fff">3</text></g><g><line x1="325" y1="60" x2="380" y2="150" stroke="#4B5563" stroke-width="1.5"></line><circle cx="392" cy="164" r="15" fill="#2C5F7C"></circle><text x="392" y="164" fill="#fff">4</text></g></g></svg>
