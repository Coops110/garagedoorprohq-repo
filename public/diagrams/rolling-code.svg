<svg viewBox="0 0 460 280" width="460" height="280" role="img" aria-labelledby="dl-rolling-code-title" aria-describedby="dl-rolling-code-desc" xmlns="http://www.w3.org/2000/svg"><title id="dl-rolling-code-title">Fixed code versus rolling code garage door remotes</title><desc id="dl-rolling-code-desc">Two remotes compared. An older fixed-code remote transmits the same code every time it is pressed, so a captured signal can be replayed. A rolling-code remote transmits a different code on every press, so a captured signal is already out of date.</desc><rect x="0" y="0" width="460" height="280" fill="#F8F7F4"></rect><rect x="26" y="40" width="74" height="104" rx="12" fill="#FFFFFF" stroke="#D9480F" stroke-width="3"></rect><circle cx="63" cy="72" r="13" fill="#D9480F"></circle><rect x="42" y="98" width="42" height="32" rx="3" fill="#EDE7D6" stroke="#4B5563" stroke-width="2"></rect><rect x="47" y="102" width="5" height="12" rx="1" fill="#1B222B"></rect><rect x="56" y="114" width="5" height="12" rx="1" fill="#1B222B"></rect><rect x="65" y="102" width="5" height="12" rx="1" fill="#1B222B"></rect><rect x="74" y="114" width="5" height="12" rx="1" fill="#1B222B"></rect><g><line x1="112" y1="64" x2="252" y2="64" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="64" font-family="Inter, sans-serif" font-size="22" fill="#D9480F" font-weight="700" dominant-baseline="central">4271</text></g><g><line x1="112" y1="94" x2="252" y2="94" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="94" font-family="Inter, sans-serif" font-size="22" fill="#D9480F" font-weight="700" dominant-baseline="central">4271</text></g><g><line x1="112" y1="124" x2="252" y2="124" stroke="#D9480F" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="124" font-family="Inter, sans-serif" font-size="22" fill="#D9480F" font-weight="700" dominant-baseline="central">4271</text></g><text x="352" y="94" font-family="Inter, sans-serif" font-size="20" fill="#4B5563" dominant-baseline="central">replayable</text><rect x="26" y="176" width="74" height="80" rx="12" fill="#FFFFFF" stroke="#2C5F7C" stroke-width="3"></rect><circle cx="63" cy="206" r="13" fill="#2C5F7C"></circle><rect x="44" y="230" width="38" height="12" rx="6" fill="#EDE7D6" stroke="#4B5563" stroke-width="2"></rect><g><line x1="112" y1="186" x2="252" y2="186" stroke="#2C5F7C" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="186" font-family="Inter, sans-serif" font-size="22" fill="#2C5F7C" font-weight="700" dominant-baseline="central">4271</text></g><g><line x1="112" y1="212" x2="252" y2="212" stroke="#2C5F7C" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="212" font-family="Inter, sans-serif" font-size="22" fill="#2C5F7C" font-weight="700" dominant-baseline="central">8093</text></g><g><line x1="112" y1="238" x2="252" y2="238" stroke="#2C5F7C" stroke-width="2.5" stroke-dasharray="8 5"></line><text x="264" y="238" font-family="Inter, sans-serif" font-size="22" fill="#2C5F7C" font-weight="700" dominant-baseline="central">1546</text></g><text x="352" y="212" font-family="Inter, sans-serif" font-size="20" fill="#4B5563" dominant-baseline="central">already stale</text><g font-family="Inter, sans-serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central"><g><circle cx="63" cy="20" r="15" fill="#D9480F"></circle><text x="63" y="20" fill="#fff">1</text><line x1="63" y1="35" x2="63" y2="40" stroke="#4B5563" stroke-width="1.5"></line></g><g><line x1="63" y1="144" x2="63" y2="156" stroke="#4B5563" stroke-width="1.5"></line><circle cx="63" cy="162" r="15" fill="#2C5F7C"></circle><text x="63" y="162" fill="#fff">2</text></g></g></svg>
