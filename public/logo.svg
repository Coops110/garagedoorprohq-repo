<!-- GarageDoorProHQ mark. Same geometry as favicon.svg and the rasters that
     scripts/build-icons.py renders: a four-panel sectional door under its
     header, on the steel-to-signal gradient from global.css. Kept as its own
     file rather than reusing favicon.svg because /logo.svg is the path
     consumers and the 2026-10-21 audit both expect, and it was 404ing.
     Organization.logo in schema.js points at logo.png, not this: Google wants
     a raster there. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="GarageDoorProHQ">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C5F7C"/>
      <stop offset="1" stop-color="#D9480F"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect x="14" y="15" width="36" height="5" rx="2" fill="#fff" opacity=".95"/>
  <rect x="14" y="24" width="36" height="6" rx="2" fill="#fff" opacity=".8"/>
  <rect x="14" y="33" width="36" height="6" rx="2" fill="#fff" opacity=".65"/>
  <rect x="14" y="42" width="36" height="6" rx="2" fill="#fff" opacity=".5"/>
</svg>
